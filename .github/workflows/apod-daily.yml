name: APOD Daily

on:
  schedule:
    # APOD は米国東部時間の 0 時に更新される = 13:00 JST（夏時間）/ 14:00 JST（冬時間）。
    # 12:13〜23:53 JST を 20 分ごとに見に行き、新しい APOD を見つけた最初の回だけ投稿する。
    # 同じ APOD ならスクリプト側のガードで即終了するので、投稿は 1 日 1 回。
    #
    # 毎時 0 分を避けて :13 / :33 / :53 に散らしているのは、GitHub Actions の schedule が
    # 毎時 0 分の混雑で遅延・スキップされるため（2026-08-27 に "0 4-12 * * *" だった頃、
    # 9 回の予定がすべてスキップされて投稿が飛んだ）。
    # 1 日 36 回試すことで、多少落とされても必ずどこかで通るようにしている。
    # 空振りの回は NASA API を 1 回叩いて終了するだけで、Claude API は呼ばない
    # （課金は実際に投稿する 1 回ぶんのみ）。
    - cron: "13,33,53 3-14 * * *" # 12:13〜23:53 JST
  workflow_dispatch: # 手動実行 / cron-job.org からの起動用
    inputs:
      force:
        description: "投稿済みの APOD でも再投稿する（動作確認用）"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # apod_seen.json のコミット用

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run APOD digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          FORCE_POST: ${{ inputs.force }}
        run: python scripts/apod_daily.py

      - name: Commit updated APOD state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apod_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update apod state $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(printf '{"channel":"C0BSUECLM1P","text":":warning: 今日の天文学（APOD）の実行に失敗しました。<%s|実行ログを確認>"}' "$RUN_URL")"
