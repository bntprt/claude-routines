name: APOD Daily

on:
  # メイン経路。cron-job.org から 13:05 JST に起動する（APOD は 13:00 JST 更新）。
  # 手動実行もここから。
  workflow_dispatch:
    inputs:
      force:
        description: "投稿済みの APOD でも再投稿する（動作確認用）"
        type: boolean
        default: false

  # 取りこぼし用。DHBR Daily Digest（cron-job.org が 6:00 JST に起動）から呼ばれる。
  # 6:00 JST 時点の最新は米国日付で前日ぶんなので、前日ぶんを投稿できていた日は
  # 重複ガードで何もせず終了し、投稿が飛んだ日だけ遅れて拾う保険として働く。
  workflow_call:
    inputs:
      force:
        description: "投稿済みの APOD でも再投稿する（動作確認用）"
        type: boolean
        default: false

  # バックアップ。ただし GitHub の schedule はこのリポジトリでは信頼できない。
  # 2026-08-27 は 9 回、8-28 は 36 回の予定がいずれも 1 度も発火せず、
  # 2 日続けて投稿が飛んだ。動けば儲けもの、という位置づけで残している。
  # 毎時 0 分は混雑するため :13 / :33 / :53 に散らしてある。
  schedule:
    - cron: "13,33,53 3-14 * * *" # 12:13〜23:53 JST

# 3 つの起動経路が重なっても、main への push が競合しないよう直列化する。
concurrency:
  group: apod-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # apod_seen.json のコミット用

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run APOD digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          FORCE_POST: ${{ inputs.force }}
        run: python scripts/apod_daily.py

      - name: Commit updated APOD state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apod_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update apod state $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(printf '{"channel":"C0BSUECLM1P","text":":warning: 今日の天文学（APOD）の実行に失敗しました。<%s|実行ログを確認>"}' "$RUN_URL")"
