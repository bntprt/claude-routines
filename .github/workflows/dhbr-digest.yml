name: DHBR Daily Digest

on:
  workflow_dispatch: # cron-job.org から毎朝 6:00 JST に起動

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # seen_articles.json のコミット用

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/dhbr_digest.py

      - name: Commit updated seen-articles list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_articles.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen articles $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
