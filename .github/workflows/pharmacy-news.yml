name: Pharmacy News Daily

on:
  schedule:
    - cron: "0 21 * * *" # 6:00 JST（GitHub Actions は数分〜十数分遅延することがある）
  workflow_dispatch: # 手動実行 / cron-job.org からの起動用

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pharmacy_seen_articles.json のコミット用

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/pharmacy_news.py

      - name: Commit updated seen-articles list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pharmacy_seen_articles.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pharmacy seen articles $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
